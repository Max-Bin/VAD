# This file is provided for backward compatibility with older setuptools versions.
# The main configuration is in pyproject.toml

[metadata]
name = mmcv
version = 0.0.1
author = MMCV Contributors
author_email = openmmlab@gmail.com
description = OpenMMLab Computer Vision Foundation
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/open-mmlab/mmcv
project_urls =
    Documentation = https://mmcv.readthedocs.io/
    Bug Reports = https://github.com/open-mmlab/mmcv/issues
    Source = https://github.com/open-mmlab/mmcv
    Changelog = https://github.com/open-mmlab/mmcv/releases

license = Apache-2.0
license_files = LICENSE
classifiers =
    Development Status :: 4 - Beta
    License :: OSI Approved :: Apache Software License
    Operating System :: OS Independent
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.8
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    Topic :: Scientific/Engineering :: Artificial Intelligence
    Topic :: Software Development :: Libraries :: Python Modules

[options]
packages = find:
python_requires = >=3.8
zip_safe = False
include_package_data = True

[options.packages.find]
include = mmcv*, adzoo*
exclude = tests*, docs*

[options.package_data]
* = *.cpp, *.cu, *.cuh, *.h, *.hpp, *.json, *.pth

[aliases]
test = pytest

[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

[flake8]
max-line-length = 79
exclude = .git,__pycache__,docs/source/conf.py,old,build,dist
ignore = E203, E266, E501, W503
max-complexity = 18
select = B,C,E,F,W,T4,B9

[yapf]
based_on_style = pep8
column_limit = 79
blank_line_before_nested_class_or_def = true
split_before_expression_after_opening_paren = true

[isort]
profile = black
line_length = 79
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true